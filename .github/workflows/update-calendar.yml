name: Update public skate calendar

on:
  schedule:
    - cron: "17 9 * * *" # 05:17 America/New_York (daylight saving), once daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate public_skate.ics
        run: python pegula_ics.py --out public_skate.ics --verbose

      - name: Commit if the schedule changed
        run: |
          if [[ -z "$(git status --porcelain public_skate.ics)" ]]; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_skate.ics
          git commit -m "Update public skate schedule ($(date -u +%Y-%m-%d))"
          git push
